name: Train and validate UPI prototype
on:
  push:
    branches: [main, receiver-reputation-fraud-prevention]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python ml/model_trainer.py
        env:
          OMP_NUM_THREADS: '2'
      - run: python -m unittest discover -s tests -v
      - run: node --check static/js/main.js
      - uses: actions/upload-artifact@v4
        with:
          name: trained-upi-models
          path: ml/models/
