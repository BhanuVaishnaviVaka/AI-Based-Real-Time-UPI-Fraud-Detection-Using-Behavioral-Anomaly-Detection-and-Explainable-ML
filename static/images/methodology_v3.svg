<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" font-family="Arial,sans-serif"><rect width="1000" height="790" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="black"/></marker></defs><g fill="black" text-anchor="middle"><text x="500" y="32" font-size="23" font-weight="bold">UPI Fraud Detection and Prevention — Methodology</text><text x="240" y="76" font-size="20" font-weight="bold">OFFLINE – Model building</text><rect x="35" y="100" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="240" y="127" font-size="18" font-weight="bold">1. Data collection</text><text x="240" y="148" font-size="13">Synthetic UPI records and profiles</text><path d="M240 168V194" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="196" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="240" y="223" font-size="18" font-weight="bold">2. Split and preprocessing</text><text x="240" y="244" font-size="13">Train / validation / test; clean and encode</text><path d="M240 264V290" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="292" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="240" y="319" font-size="18" font-weight="bold">3. Feature engineering</text><text x="240" y="340" font-size="13">Behavioral signals and receiver reputation</text><path d="M240 360V386" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="388" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="240" y="415" font-size="18" font-weight="bold">4. Class imbalance handling</text><text x="240" y="436" font-size="13">Class weighting on training data</text><path d="M240 456V482" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="484" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="240" y="511" font-size="18" font-weight="bold">5. Hybrid training</text><text x="240" y="532" font-size="13">Isolation Forest + RF + XGBoost</text><path d="M240 552V578" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="580" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="240" y="607" font-size="18" font-weight="bold">6. Fusion and thresholds</text><text x="240" y="628" font-size="13">Four risk bands; validation check</text><path d="M240 648V674" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="676" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="240" y="703" font-size="18" font-weight="bold">7. Evaluate and save</text><text x="240" y="724" font-size="13">PR-AUC, recall, FPR; model artifacts</text><text x="760" y="76" font-size="20" font-weight="bold">ONLINE – Application</text><rect x="555" y="100" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="760" y="127" font-size="18" font-weight="bold">8. Transaction request</text><text x="760" y="148" font-size="13">Simulated UPI payment</text><path d="M760 168V194" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="555" y="196" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="760" y="223" font-size="18" font-weight="bold">9. Real-time features</text><text x="760" y="244" font-size="13">Transaction context and receiver score</text><path d="M760 264V290" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="555" y="292" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="760" y="319" font-size="18" font-weight="bold">10. Hybrid risk scoring</text><text x="760" y="340" font-size="13">0–100 risk score + TreeSHAP</text><path d="M760 360V386" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="555" y="388" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="760" y="415" font-size="18" font-weight="bold">11. Decision routing</text><text x="760" y="436" font-size="13">Safe / Suspicious / High / Critical</text><path d="M760 456V482" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="555" y="484" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="760" y="511" font-size="18" font-weight="bold">12. Approve, hold or block</text><text x="760" y="532" font-size="13">Explanation; held funds do not move</text><path d="M760 552V578" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="555" y="580" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="760" y="607" font-size="18" font-weight="bold">13. Verification / security action</text><text x="760" y="628" font-size="13">Confirm, extra code, cancel or block</text><path d="M760 648V674" stroke="black" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="555" y="676" width="410" height="68" rx="5" fill="white" stroke="black" stroke-width="2"/><text x="760" y="703" font-size="18" font-weight="bold">14. Log and monitor</text><text x="760" y="724" font-size="13">History, dashboard and review flags</text><path d="M445 710H500V326H553" fill="none" stroke="black" stroke-width="2" marker-end="url(#a)"/><text x="497" y="540" font-size="12" transform="rotate(-90 497 540)">saved model</text></g></svg>